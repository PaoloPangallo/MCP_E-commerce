name: Portfolio CI — syntax and frontend build

on:
  push:
    branches: [Paolo_minimax2.7, portfolio-refresh-2026-10]
  pull_request:

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend and test sources
        run: python -m compileall -q app tests

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebay-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ebay-ui/package-lock.json
      - run: npm ci
      - run: npm run build
