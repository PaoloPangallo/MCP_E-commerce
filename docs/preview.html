<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP_ECOM — Activity Diagrams Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f7f4;
      --surface: #ffffff;
      --surface-2: #f3f2ef;
      --border: #e5e3de;
      --text: #1a1a1a;
      --text-2: #6b6b6b;
      --text-3: #a3a3a3;
      --green: #10a37f;
      --green-bg: #e6f4f0;
      --green-border: #b8ddd3;
      --blue: #4787d7;
      --blue-bg: #dae9fb;
      --blue-border: #b3d1f0;
      --amber: #c97d27;
      --amber-bg: #fdf0de;
      --amber-border: #f5e0c0;
      --purple: #9055cc;
      --purple-bg: #ede8f8;
      --purple-border: #d8c8f0;
      --red: #d94f4f;
      --red-bg: #fde8e8;
      --title-size: clamp(1.5rem, 4vw, 2.75rem);
      --h2-size: clamp(1.1rem, 2.5vw, 1.75rem);
      --body-size: clamp(0.75rem, 1.3vw, 1rem);
      --small-size: clamp(0.65rem, 1vw, 0.85rem);
      --slide-padding: clamp(1.5rem, 5vw, 4rem);
    }
    html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100%; overflow-x: hidden; }
    .slide { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
    .slide-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: var(--slide-padding); max-height: 100%; overflow: hidden; }
    .slide-inner { max-width: 1000px; margin: 0 auto; width: 100%; }
    .slide-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .slide-number { font-size: var(--small-size); font-weight: 600; color: var(--text-3); font-family: 'JetBrains Mono', monospace; min-width: 2rem; }
    h2 { font-size: var(--h2-size); font-weight: 600; letter-spacing: -0.02em; }
    .tag { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.65rem; border-radius: 9999px; font-size: var(--small-size); font-weight: 500; }
    .tag-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .tag-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
    .tag-amber { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .tag-purple { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
    code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; border: 1px solid var(--border); }

    /* ===== SVG DIAGRAM STYLES ===== */
    .diagram-wrap { display: flex; justify-content: center; overflow-x: auto; padding: 0.5rem 0; }
    .diagram-wrap svg { max-width: 100%; height: auto; }

    /* ===== NAV ===== */
    .nav { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 9999px; padding: 0.4rem 0.8rem; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all 0.2s; }
    .nav-dot.active { background: var(--green); width: 18px; border-radius: 3px; }
    .nav-dot:hover:not(.active) { background: var(--text-3); }
    .slide-counter { font-size: var(--small-size); color: var(--text-3); padding: 0 0.5rem; }
    .progress { position: fixed; top: 0; left: 0; height: 2px; background: var(--green); width: 0%; z-index: 200; transition: width 0.3s ease; }

    /* ===== TITLE SLIDE ===== */
    .title-slide { background: var(--bg); }
    .title-slide .slide-content { text-align: center; }
    .title-slide h1 { color: var(--text); margin-bottom: 0.5rem; font-size: var(--title-size); font-weight: 600; letter-spacing: -0.03em; }
    .title-slide .subtitle { color: var(--text-2); font-size: var(--h2-size); font-weight: 300; margin-bottom: 1.5rem; }
    .title-slide .meta { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
    .tag-browse { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.65rem; border-radius: 9999px; font-size: var(--small-size); font-weight: 500; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .slide:not(.reduced-motion) .slide-content > * { animation: fadeUp 0.45s ease both; }
    .slide:not(.reduced-motion) .slide-content > *:nth-child(1) { animation-delay: 0.05s; }
    .slide:not(.reduced-motion) .slide-content > *:nth-child(2) { animation-delay: 0.15s; }
    .slide:not(.reduced-motion) .slide-content > *:nth-child(3) { animation-delay: 0.25s; }
    @media (prefers-reduced-motion: reduce) { .slide:not(.reduced-motion) .slide-content > * { animation: none; } }
    .reduced-motion .slide-content > * { animation: none !important; }

    @media (max-height: 600px) { .nav { display: none; } }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="progress" id="progress"></div>

<!-- ===== SLIDE 1: TITLE ===== -->
<section class="slide title-slide" id="s1">
  <div class="slide-content">
    <div class="slide-inner">
      <p class="tag tag-green" style="margin-bottom:1rem">Backend Architecture</p>
      <h1>MCP_ECOM</h1>
      <p class="subtitle">Activity Diagrams</p>
      <div class="meta">
        <span class="tag-browse">Python</span>
        <span class="tag-browse">FastAPI</span>
        <span class="tag-browse">FastMCP</span>
        <span class="tag-browse">Redis</span>
        <span class="tag-browse">PostgreSQL</span>
      </div>
    </div>
  </div>
</section>

<!-- ===== SLIDE 2: AGENT STREAM (SVG) ===== -->
<section class="slide" id="s2" style="background:var(--surface);">
  <div class="slide-content">
    <div class="slide-inner">
      <div class="slide-header">
        <span class="slide-number">01</span>
        <h2>Agent Stream — <code>/agent/stream</code></h2>
        <span class="tag tag-blue">main flow</span>
        <span class="tag tag-purple">async</span>
      </div>
      <div class="diagram-wrap">
        <svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="#d4d0c8"/>
            </marker>
            <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="#10a37f"/>
            </marker>
            <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
            </filter>
          </defs>

          <!-- START -->
          <rect x="370" y="8" width="160" height="36" rx="18" fill="#e6f4f0" stroke="#b8ddd3" stroke-width="1.5"/>
          <text x="450" y="31" text-anchor="middle" fill="#10a37f" font-size="13" font-weight="600">Start</text>

          <!-- Arrow: Start → HTTP POST -->
          <line x1="450" y1="44" x2="450" y2="70" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <text x="470" y="62" fill="#6b6b6b" font-size="11" font-style="italic">HTTP POST /agent/stream</text>

          <!-- HTTP POST box -->
          <rect x="340" y="72" width="220" height="36" rx="8" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="450" y="95" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="500">EbayReactAgent.run_stream()</text>

          <!-- Arrow → Semaphore -->
          <line x1="450" y1="108" x2="450" y2="134" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

          <!-- Semaphore diamond -->
          <polygon points="450,136 530,164 450,192 370,164" fill="#fdf0de" stroke="#f5e0c0" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="450" y="167" text-anchor="middle" fill="#c97d27" font-size="11" font-weight="600">semaphore</text>
          <text x="450" y="180" text-anchor="middle" fill="#c97d27" font-size="11" font-weight="600">available?</text>

          <!-- Arrow: yes → loop -->
          <line x1="450" y1="192" x2="450" y2="218" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <text x="468" y="210" fill="#6b6b6b" font-size="11" font-style="italic">yes</text>

          <!-- Loop box -->
          <rect x="300" y="220" width="300" height="36" rx="8" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="450" y="243" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="500">ReAct Loop (max 6 steps)</text>

          <!-- Arrow: loop → fork label -->
          <line x1="450" y1="256" x2="450" y2="282" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

          <!-- Fork -->
          <rect x="310" y="284" width="280" height="80" rx="10" fill="#dae9fb" stroke="#b3d1f0" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="450" y="302" text-anchor="middle" fill="#4787d7" font-size="11" font-weight="600">PARALLEL</text>
          <line x1="360" y1="308" x2="540" y2="308" stroke="#b3d1f0" stroke-width="1"/>
          <text x="450" y="322" text-anchor="middle" fill="#4787d7" font-size="10">① Vision Preprocessing (if image)</text>
          <text x="450" y="338" text-anchor="middle" fill="#4787d7" font-size="10">② Memory Hydration (Redis)</text>
          <text x="450" y="354" text-anchor="middle" fill="#4787d7" font-size="10">③ Task Decomposition + Planner Decide</text>

          <!-- Arrow: fork → decision -->
          <line x1="450" y1="364" x2="450" y2="390" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

          <!-- Decision: stop? -->
          <polygon points="450,392 540,420 450,448 360,420" fill="#ede8f8" stroke="#d8c8f0" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="450" y="423" text-anchor="middle" fill="#9055cc" font-size="11" font-weight="600">action ==</text>
          <text x="450" y="437" text-anchor="middle" fill="#9055cc" font-size="11" font-weight="600">"stop"?</text>

          <!-- Arrow: no → tool call -->
          <line x1="540" y1="420" x2="620" y2="420" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <text x="575" y="414" fill="#6b6b6b" font-size="11" font-style="italic">no</text>

          <!-- Tool call box -->
          <rect x="622" y="404" width="220" height="32" rx="8" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="732" y="424" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="500">MCPToolClient → Service</text>

          <!-- Arrow: tool call → end of loop -->
          <line x1="732" y1="436" x2="732" y2="472" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <line x1="732" y1="472" x2="450" y2="472" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <text x="590" y="468" fill="#6b6b6b" font-size="10">Memory.apply_observation()</text>

          <!-- Arrow: yes → finalize -->
          <line x1="360" y1="420" x2="250" y2="420" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
          <text x="305" y="414" fill="#6b6b6b" font-size="11" font-style="italic">yes</text>

          <!-- Finalize box -->
          <rect x="60" y="404" width="190" height="32" rx="8" fill="#e6f4f0" stroke="#b8ddd3" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="155" y="424" text-anchor="middle" fill="#10a37f" font-size="12" font-weight="500">_finalize_stream() → SSE</text>

          <!-- Arrow: finalize → end -->
          <line x1="155" y1="436" x2="155" y2="472" stroke="#10a37f" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
          <line x1="155" y1="472" x2="370" y2="472" stroke="#10a37f" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
          <line x1="370" y1="472" x2="370" y2="500" stroke="#10a37f" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

          <!-- END -->
          <rect x="290" y="500" width="160" height="20" rx="10" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5"/>
          <text x="370" y="514" text-anchor="middle" fill="#a3a3a3" font-size="11">End</text>

          <!-- Note: heartbeat -->
          <text x="760" y="230" fill="#a3a3a3" font-size="10" font-style="italic">heartbeat</text>
          <text x="760" y="244" fill="#a3a3a3" font-size="10" font-style="italic">every 5s</text>

          <!-- Note: timeout -->
          <text x="140" y="470" fill="#a3a3a3" font-size="10" font-style="italic">hard timeout</text>
          <text x="140" y="483" fill="#a3a3a3" font-size="10" font-style="italic">380s</text>
        </svg>
      </div>
    </div>
  </div>
</section>

<!-- ===== SLIDE 3: SEARCH PIPELINE (SVG) ===== -->
<section class="slide" id="s3" style="background:var(--surface);">
  <div class="slide-content">
    <div class="slide-inner">
      <div class="slide-header">
        <span class="slide-number">02</span>
        <h2>Search Pipeline</h2>
        <span class="tag tag-green">search</span>
        <span class="tag tag-blue">parallel</span>
      </div>
      <div class="diagram-wrap">
        <svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
          <defs>
            <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="#d4d0c8"/>
            </marker>
            <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
            </filter>
          </defs>

          <!-- START -->
          <rect x="370" y="8" width="160" height="36" rx="18" fill="#e6f4f0" stroke="#b8ddd3" stroke-width="1.5"/>
          <text x="450" y="31" text-anchor="middle" fill="#10a37f" font-size="13" font-weight="600">Start</text>

          <line x1="450" y1="44" x2="450" y2="68" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>
          <text x="472" y="61" fill="#6b6b6b" font-size="11" font-style="italic">POST /search</text>

          <!-- Parse Query -->
          <rect x="320" y="70" width="260" height="36" rx="8" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5" filter="url(#s)"/>
          <text x="450" y="93" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="500">parse_query_service() — LLM</text>

          <line x1="450" y1="106" x2="450" y2="130" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

          <!-- Cache diamond -->
          <polygon points="450,132 530,160 450,188 370,160" fill="#fdf0de" stroke="#f5e0c0" stroke-width="1.5" filter="url(#s)"/>
          <text x="450" y="163" text-anchor="middle" fill="#c97d27" font-size="11" font-weight="600">cache hit?</text>

          <!-- yes → return cached -->
          <line x1="530" y1="160" x2="680" y2="160" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>
          <text x="600" y="154" fill="#6b6b6b" font-size="11" font-style="italic">yes</text>
          <rect x="682" y="144" width="160" height="32" rx="8" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5" filter="url(#s)"/>
          <text x="762" y="164" text-anchor="middle" fill="#a3a3a3" font-size="12">Return cached</text>
          <line x1="762" y1="176" x2="762" y2="390" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>
          <line x1="762" y1="390" x2="370" y2="390" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>
          <line x1="370" y1="390" x2="370" y2="404" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

          <!-- no → continue -->
          <line x1="450" y1="188" x2="450" y2="212" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>
          <text x="468" y="205" fill="#6b6b6b" font-size="11" font-style="italic">no</text>

          <!-- eBay Search -->
          <rect x="320" y="214" width="260" height="36" rx="8" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5" filter="url(#s)"/>
          <text x="450" y="237" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="500">ebay.search_items() — Browse API</text>

          <line x1="450" y1="250" x2="450" y2="274" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

          <!-- Parallel RAG -->
          <rect x="270" y="276" width="360" height="60" rx="10" fill="#dae9fb" stroke="#b3d1f0" stroke-width="1.5" filter="url(#s)"/>
          <text x="450" y="294" text-anchor="middle" fill="#4787d7" font-size="11" font-weight="600">PARALLEL RAG RERANKING</text>
          <line x1="320" y1="302" x2="580" y2="302" stroke="#b3d1f0" stroke-width="1"/>
          <text x="450" y="317" text-anchor="middle" fill="#4787d7" font-size="10">① Vector embedding + similarity search</text>
          <text x="450" y="331" text-anchor="middle" fill="#4787d7" font-size="10">② BM25 keyword matching</text>

          <line x1="450" y1="336" x2="450" y2="360" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

          <!-- Trust Scoring -->
          <rect x="320" y="362" width="260" height="28" rx="8" fill="#f3f2ef" stroke="#e5e3de" stroke-width="1.5" filter="url(#s)"/>
          <text x="450" y="381" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="500">Trust Scoring + Normalize</text>

          <line x1="450" y1="390" x2="450" y2="404" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

          <!-- END -->
          <rect x="340" y="404" width="220" height="20" rx="10" fill="#e6f4f0" stroke="#b8ddd3" stroke-width="1.5"/>
          <text x="450" y="418" text-anchor="middle" fill="#10a37f" font-size="11">Return SearchResponse</text>
        </svg>
      </div>
    </div>
  </div>
</section>

<!-- ===== NAV ===== -->
<nav class="nav" id="nav">
  <div class="nav-dot active" data-slide="1"></div>
  <div class="nav-dot" data-slide="2"></div>
  <div class="nav-dot" data-slide="3"></div>
  <span class="slide-counter" id="counter">1 / 3</span>
</nav>

<script>
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.nav-dot');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const total = slides.length;

  function updateUI(idx) {
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    counter.textContent = `${idx + 1} / ${total}`;
    progress.style.width = `${((idx + 1) / total) * 100}%`;
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = Array.from(slides).indexOf(entry.target);
        current = idx;
        updateUI(idx);
      }
    });
  }, { threshold: 0.5 });

  let current = 0;
  slides.forEach(s => observer.observe(s));

  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      const n = parseInt(dot.dataset.slide) - 1;
      slides[n].scrollIntoView({ behavior: 'smooth' });
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      if (current < total - 1) slides[current + 1].scrollIntoView({ behavior: 'smooth' });
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      if (current > 0) slides[current - 1].scrollIntoView({ behavior: 'smooth' });
    }
  });

  let touchStartY = 0;
  document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
  document.addEventListener('touchend', e => {
    const delta = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(delta) > 40) {
      if (delta > 0 && current < total - 1) slides[current + 1].scrollIntoView({ behavior: 'smooth' });
      if (delta < 0 && current > 0) slides[current - 1].scrollIntoView({ behavior: 'smooth' });
    }
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.slide').forEach(s => s.classList.add('reduced-motion'));
  }
</script>

</body>
</html>
